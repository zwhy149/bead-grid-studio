name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        # Match CI: two bounded attempts need room for termination and backoff.
        timeout-minutes: 20
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Installing Playwright browsers (attempt ${attempt}/2)"
            if timeout --signal=TERM --kill-after=30s 480s \
              npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Playwright install timed out or failed; retrying with a clean browser cache."
              rm -rf "$HOME/.cache/ms-playwright"
              sleep 15
            fi
          done
          exit "$status"
      - name: Verify production build
        run: npm run qa
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
