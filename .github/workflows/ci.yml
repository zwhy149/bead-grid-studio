name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Browser downloads occasionally stall on the hosted runner. Leave room for
    # one bounded retry and the full cross-browser suite.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        # These OS packages are not included in the browser cache. Install them
        # on every runner so a cache hit cannot skip a required dependency.
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        # The two Chromium projects cover desktop and mobile. Keeping the
        # required CI path to one browser avoids an unreliable multi-hundred-MB
        # cold download of Firefox and WebKit on every hosted runner.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Installing Playwright Chromium (attempt ${attempt}/2)"
            if timeout --signal=TERM --kill-after=30s 480s \
              npx playwright install chromium; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Playwright install timed out or failed; retrying with a clean browser cache."
              rm -rf "$HOME/.cache/ms-playwright"
              sleep 15
            fi
          done
          exit "$status"
      - name: Save Playwright Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Run quality gates
        run: npm run qa:ci
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
