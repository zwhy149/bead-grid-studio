name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Browser downloads occasionally stall on the hosted runner. Leave room for
    # one bounded retry and the full cross-browser suite.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium browser
        # The two Chromium projects cover desktop and mobile. Keeping the
        # required CI path to one browser avoids an unreliable multi-hundred-MB
        # cold download of Firefox and WebKit on every hosted runner. Ubuntu
        # hosted images include the shared browser libraries; do not invoke apt
        # here because it can block independently of Playwright. The smoke suite
        # verifies the resulting browser can actually launch.
        timeout-minutes: 20
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Installing Playwright Chromium (attempt ${attempt}/2)"
            if timeout --signal=TERM --kill-after=30s 480s \
              npx playwright install chromium; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Playwright install timed out or failed; retrying with a clean browser cache."
              rm -rf "$HOME/.cache/ms-playwright"
              sleep 15
            fi
          done
          exit "$status"
      - name: Save Playwright Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Run quality gates
        run: npm run qa:ci
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
