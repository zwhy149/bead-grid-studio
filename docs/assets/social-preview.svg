<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4a4640" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#24221f"/>
  <rect x="760" width="520" height="640" fill="url(#grid)" opacity=".62"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="76" y="92" fill="#dc6b55" font-size="24" font-weight="700" letter-spacing="4">BEAD GRID STUDIO · OPEN SOURCE</text>
    <text x="76" y="196" fill="#fffdf7" font-size="72" font-weight="800">豆格工坊</text>
    <text x="76" y="266" fill="#f4e0d6" font-size="34" font-weight="600">小网格也尽量保住轮廓与部件</text>
    <text x="76" y="326" fill="#aaa49b" font-size="25">Local-first · Topology-aware · Printable</text>
    <g transform="translate(76 394)">
      <rect width="194" height="58" rx="12" fill="#a94726"/>
      <text x="97" y="38" fill="white" text-anchor="middle" font-size="22" font-weight="700">上传 → 图纸</text>
      <rect x="212" width="198" height="58" rx="12" fill="#34312d" stroke="#5f5a53"/>
      <text x="311" y="38" fill="#fffdf7" text-anchor="middle" font-size="22" font-weight="700">221 基础色</text>
    </g>
    <text x="76" y="548" fill="#aaa49b" font-size="21">Web / PWA / Portable single HTML</text>
  </g>
  <g transform="translate(824 80)" filter="url(#shadow)">
    <rect width="360" height="480" rx="28" fill="#f8f6f0"/>
    <g transform="translate(34 78)">
      <g fill="#fff" stroke="#bbb5aa">
        <rect width="292" height="292"/>
      </g>
      <g fill="#24221f">
        <rect x="112" y="16" width="68" height="16"/><rect x="96" y="32" width="100" height="16"/>
        <rect x="80" y="48" width="132" height="16"/><rect x="64" y="64" width="164" height="16"/>
        <rect x="48" y="80" width="32" height="16"/><rect x="212" y="80" width="32" height="16"/>
        <rect x="32" y="96" width="32" height="80"/><rect x="228" y="96" width="32" height="80"/>
        <rect x="48" y="176" width="32" height="32"/><rect x="212" y="176" width="32" height="32"/>
        <rect x="64" y="208" width="32" height="32"/><rect x="196" y="208" width="32" height="32"/>
        <rect x="80" y="240" width="132" height="16"/>
      </g>
      <g fill="#4e846d"><rect x="96" y="112" width="32" height="48"/><rect x="164" y="112" width="32" height="48"/></g>
      <g fill="#dc6b55"><rect x="112" y="192" width="68" height="16"/></g>
    </g>
    <text x="180" y="418" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" fill="#24221f" font-size="26" font-weight="800">24 × 24</text>
    <text x="180" y="451" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" fill="#6d675f" font-size="17">structure before noise</text>
  </g>
